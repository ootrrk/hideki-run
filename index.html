<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b9e9f4">
  <title>英樹走 - 風を追い越せ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-state="title">
  <main class="game-shell">
    <header class="topbar">
      <a class="wordmark" href="#" aria-label="英樹走">英樹<span>走</span></a>
      <div class="hud" aria-label="ゲームスコア">
        <div><span class="hud-label">DISTANCE</span><strong id="distance">0 m</strong></div>
        <div><span class="hud-label">SCORE</span><strong id="score">0</strong></div>
        <div><span class="hud-label">BALLS</span><strong id="coins">0</strong></div>
        <div class="best-stat"><span class="hud-label">BEST</span><strong id="best">0</strong></div>
      </div>
      <button class="sound-button" id="sound-toggle" type="button" aria-label="サウンドをオンにする" aria-pressed="false" title="サウンド切替">♪</button>
    </header>

    <section class="playfield" aria-label="英樹走 ゲーム画面">
      <canvas id="game-canvas" aria-label="自転車で走るゲーム"></canvas>
      <div class="screen title-screen" id="title-screen">
        <div class="title-copy">
          <p class="eyebrow">A LITTLE WIND, A LONG WAY</p>
          <h1>英樹<span>走</span></h1>
          <p class="subtitle">風を追い越せ。ボールを集めろ。</p>
          <button class="primary-button" id="start-button" type="button"><span>ライド開始</span><b>→</b></button>
          <p class="controls-hint">SPACE / W / ↑ / クリック / タップ でジャンプ</p>
        </div>
        <div class="title-sticker" aria-hidden="true"><span>READY</span><strong>GO!</strong></div>
      </div>
      <div class="screen gameover-screen" id="gameover-screen" hidden>
        <div class="result-panel">
          <p class="eyebrow">RIDE COMPLETE</p>
          <h2>GAME OVER</h2>
          <div class="missed-character" id="missed-character" hidden>
            <canvas id="missed-face" width="112" height="112" aria-label="捕まえられなかった人物の顔"></canvas>
            <strong id="missed-character-name"></strong>
          </div>
          <p class="gameover-message" id="gameover-message" hidden></p>
          <p class="failure-comment" id="failure-comment" aria-live="polite" hidden></p>
          <div class="result-grid">
            <div><span>スコア</span><strong id="final-score">0</strong></div>
            <div><span>到達距離</span><strong id="final-distance">0 m</strong></div>
            <div><span>ボール</span><strong id="final-coins">0</strong></div>
            <div><span>ハイスコア</span><strong id="final-best">0</strong></div>
          </div>
          <button class="primary-button" id="restart-button" type="button"><span>もう一度遊ぶ</span><b>↻</b></button>
          <p class="controls-hint">SPACE / W / ↑ / クリック / タップ でジャンプ</p>
        </div>
      </div>
    </section>
    <footer class="footer-note"><span>KEEP YOUR WHEELS TURNING</span><span>ひと漕ぎ先の景色へ。</span></footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
